      --accent-color: #b30000;

      --bg-color: #0d0e12;
      --card-bg: #16181f;
      --text-color: #e0e0e0;
      --button-bg: #2a2d37;
      --button-text: #ffffff;

    }

      color: var(--text-color);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 18px;
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      background-color: var(--button-bg);
      color: var(--button-text);
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;

      max-width: 360px;

      text-align: center;
      padding-bottom: 20px;
      transition: background-color 0.3s;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card h2 {
      margin: 15px 0 5px;
      color: var(--accent-color);
    }

    .card p {
      padding: 0 20px;
      font-size: 0.95em;
      line-height: 1.4;
    }

    .like-btn {
      background-color: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      transition: all 0.2s ease;
      margin-top: 15px;
    }

    .like-btn.liked {
      background-color: var(--accent-color);
      color: #ffffff;
    }
  </style>
</head>
