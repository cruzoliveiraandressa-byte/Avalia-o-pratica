<html lang="pt-BR">
<head>

    body {

      font-family: 'Trebuchet MS', 'Arial', sans-serif;

      background-clip: text;
      filter: drop-shadow(0 0 15px rgba(211, 47, 47, 0.6));

    }

    .wolf-subtitle {
      color: #888;

  <div class="wolf-container">
