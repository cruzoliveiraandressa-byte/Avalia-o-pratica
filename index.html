<html lang="pt-BR">
<head>

  <title>Teen Wolf</title>
  <style>
    body {
      background-color: #406efb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    .teen-wolf-title {
      font-size: 4rem;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 
        0 0 10px rgba(5, 88, 121, 0.8),
        0 0 20px rgba(0, 183, 255, 0.5),
        0 0 30px rgba(0, 183, 255, 0.3);
      position: relative;
      transition: transform 0.3s ease;
    }

    .teen-wolf-title span {
      color: #084157;
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(2, 85, 118, 0.9);
    }

    .teen-wolf-title:hover {
      transform: scale(1.05);
    }
  </style>
